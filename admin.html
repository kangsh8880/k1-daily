<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>관리자 · K1 Daily</title>
<meta name="theme-color" content="#D6E4F0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="K1 Daily">
<link rel="stylesheet" href="css/style.css?v=0.1.2">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/config.js?v=0.1.2"></script>
<script src="js/i18n.js?v=0.1.2"></script>
<script src="js/common.js?v=0.1.2"></script>
<script src="js/admin.js?v=0.1.2"></script>
</head>
<body>
<main class="app" id="main">
  <div class="topbar"><div class="brand"><img src="assets/icon-192.png" alt=""><span>관리자</span></div><a class="btn sm" href="settings.html">← 설정</a></div>
  <p class="help">중앙에는 사람이 없습니다. 아래 룰이 개인에게 준수율과 응원 메시지를 자동으로 보여 줍니다. 개인의 체크 항목·결과는 관리자도 볼 수 없습니다.</p>
  <div class="tabs"><button class="on" data-tab="msg">응원 메시지</button><button data-tab="banner">하단 배너</button><button data-tab="rule">룰 기준</button></div>
  <section id="tab-msg">
    <div class="row wrap"><select class="input grow" id="msg-rule"></select><button class="btn primary" id="msg-add">+ 메시지 추가</button></div>
    <p class="help" id="msg-rule-desc"></p>
    <div class="table-wrap" id="msg-list"></div>
  </section>
  <section id="tab-banner" class="hidden">
    <div class="row between"><p class="help grow">오늘·리포트 화면 하단에 가중치 비율로 1개씩 노출됩니다.</p><button class="btn primary" id="banner-add">+ 배너 추가</button></div>
    <div class="table-wrap" id="banner-list"></div>
  </section>
  <section id="tab-rule" class="hidden">
    <div class="table-wrap" id="rule-list"></div>
  </section>
</main>
</body>
</html>
