<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>리포트 · 루틴원</title>
<meta name="theme-color" content="#D6E4F0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="루틴원">
<link rel="stylesheet" href="css/style.css?v=0.2.2">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<script src="js/config.js?v=0.2.2"></script>
<script src="js/i18n.js?v=0.2.2"></script>
<script src="js/common.js?v=0.2.2"></script>
<script src="js/push.js?v=0.2.2"></script>
<script src="js/report.js?v=0.2.2"></script>
</head>
<body>
<main class="app">
  <div class="topbar"><div class="brand"><img src="assets/icon-192.png" alt=""><span data-i18n="report.title">준수율 리포트</span></div></div>
  <div class="kpis k4">
    <div class="kpi" id="kt-today"><div class="k-label" data-i18n="report.today">오늘</div><div class="k-val">-<span class="k-unit">%</span></div><div class="k-sub"></div></div>
    <div class="kpi" id="kt-7"><div class="k-label" data-i18n="report.d7">최근 7일</div><div class="k-val">-<span class="k-unit">%</span></div><div class="k-sub"></div></div>
    <div class="kpi" id="kt-30"><div class="k-label" data-i18n="report.d30">최근 30일</div><div class="k-val">-<span class="k-unit">%</span></div><div class="k-sub"></div></div>
    <div class="kpi" id="kt-streak"><div class="k-label" data-i18n="report.streak">연속 달성</div><div class="k-val">-<span class="k-unit">일</span></div><div class="k-sub"></div></div>
  </div>
  <div id="feedback"></div>
  <div class="card">
    <div class="row between wrap"><h3 id="chart-title">준수율 추이</h3>
      <div class="seg" id="range"><button data-n="7" class="on">7일</button><button data-n="14">14일</button><button data-n="30">30일</button></div></div>
    <div class="chart-box"><canvas id="chart" aria-label="준수율 추이 차트"></canvas></div>
  </div>
  <div class="card"><h3 data-i18n="report.byCat">분류별 준수율 (최근 7일)</h3><div class="table-wrap" id="cat-table"></div></div>
  <div class="card"><h3 data-i18n="report.byItem">항목별 준수율 (최근 7일, 낮은 순)</h3><div class="table-wrap" id="item-table"></div></div>
  <div id="banner"></div>
</main>
</body>
</html>
