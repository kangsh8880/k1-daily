<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>로그인 · K1 Daily</title>
<meta name="theme-color" content="#D6E4F0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="K1 Daily">
<link rel="stylesheet" href="css/style.css?v=0.2.1">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/config.js?v=0.2.1"></script>
<script src="js/i18n.js?v=0.2.1"></script>
<script src="js/common.js?v=0.2.1"></script>
<script src="js/index.js?v=0.2.1"></script>
</head>
<body>
<main class="app">
  <div class="login-box">
    <div class="center"><img src="assets/icon-192.png" alt="" class="logo"><h1 class="page-title" data-i18n="app.name">K1 Daily</h1>
      <div class="sub" data-i18n="app.tagline">나만의 시간대별 체크리스트</div></div>
    <div class="card strong">
      <div id="step-email">
        <h3 data-i18n="login.title">로그인</h3>
        <p class="help" data-i18n="login.desc">이메일로 받은 인증 코드로 로그인합니다.</p>
        <form id="form-email">
          <label class="lbl" for="email" data-i18n="login.email">이메일</label>
          <input class="input" id="email" type="email" autocomplete="email" inputmode="email" placeholder="name@example.com" required>
          <button class="btn primary block mt" id="btn-send" type="submit" data-i18n="login.send">인증 코드 받기</button>
        </form>
      </div>
      <div id="step-code" class="hidden">
        <h3 data-i18n="login.title">로그인</h3>
        <p class="help" id="sent-msg"></p>
        <form id="form-code">
          <label class="lbl" for="code" data-i18n="login.code">메일로 받은 인증 코드</label>
          <input class="input code-input" id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="10" placeholder="000000">
          <button class="btn primary block mt" id="btn-verify" type="submit" data-i18n="login.verify">로그인</button>
        </form>
        <div class="row between mt"><button class="btn ghost sm" id="btn-change" data-i18n="login.changeEmail">이메일 바꾸기</button>
          <button class="btn ghost sm" id="btn-resend" data-i18n="login.resend">코드 다시 받기</button></div>
      </div>
    </div>
    <p class="help center" data-i18n="login.homeHint">홈 화면에 추가해서 앱처럼 쓰면 알림을 받을 수 있습니다.</p>
    <p class="help center"><a href="privacy.html">개인정보 처리방침</a></p>
  </div>
</main>
</body>
</html>
